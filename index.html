<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Podgląd modelu 3D</title>
  
  <!-- Import biblioteki model-viewer z CDN -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }

    model-viewer {
      width: 100%;
      max-width: 800px;
      height: 600px;
      background-color: #2a2a2a;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <!-- Komponent 3D -->
  <model-viewer 
    src="prev.glb" 
    alt="Podgląd modelu 3D"
    camera-controls 
    auto-rotate 
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral">
  </model-viewer>

</body>
</html>
